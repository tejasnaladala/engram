name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          rustup default 1.94.0
      - name: Test workspace
        run: cargo test --workspace
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Install build tools
        run: python -m pip install maturin==1.9.4 ruff==0.16.5
      - name: Build native extension
        run: maturin build --release --manifest-path crates/engram-python/Cargo.toml --out dist
      - name: Install native extension
        run: python -m pip install dist/*.whl
      - name: Test Python API
        run: python -m unittest discover -s tests -v
      - name: Test native runtime
        run: python tests/native_runtime_smoke.py
      - name: Lint Python
        run: ruff check python benchmarks examples tests
      - name: Build distribution
        if: matrix.python-version == '3.11'
        run: maturin sdist --manifest-path crates/engram-python/Cargo.toml --out dist

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check and build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
